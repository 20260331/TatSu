rubrics:
  - id: 1
    type: f2p
    text: 新增可选的成套导出与加载入口，不改动也不强制使用原有生成接口。

  - id: 2
    type: f2p
    text: 导出产物把 parser 与对象模型放在同一目录，并附带可检查的生成身份与两份文件的内容校验信息。

  - id: 3
    type: f2p
    text: 该产物目录可搬迁，整体移动或复制到另一位置后仍能正常加载并解析。

  - id: 4
    type: f2p
    text: 加载前拒绝内容损坏或缺失的文件，且拒绝发生在执行产物代码之前。

  - id: 5
    type: f2p
    text: 加载前拒绝来自不同次生成的文件混用，即使重算内容摘要也不能绕过产物身份一致性检查。

  - id: 6
    type: f2p
    text: 加载返回可配套解析的 parser 与模型类型，解析结果由该产物自带的模型类构造。

  - id: 7
    type: f2p
    text: 生成失败时保留原有产物目录，不留下半套新文件或临时残留。

  - id: 8
    type: f2p
    text: 两套同名 grammar 同时加载时类型、结果与状态各自隔离，不串类或串状态。

  - id: 9
    type: p2p
    text: 既有生成接口行为不变，新增实现不影响原有生成相关测试。
